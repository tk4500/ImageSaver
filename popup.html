<!DOCTYPE html>
<html>
    <head>
        <title>Pinboard</title>
        <link rel="stylesheet" href="popup.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="container">
            <h1>My Pinboard</h1>

            <div class="controls">
                <form id="new-folder-form">
                    <input type="text" id="folder-name-input"
                        placeholder="New folder name" required>
                    <button type="submit">Create Folder</button>
                    <div id="bulk-controls" class="bulk-controls"></div>

    <!-- Bulk selection UI is now handled in popup.js – placeholder removed -->



            </div>

            <div class="content">
                <div id="folders-list" class="sidebar">
                    <!-- Folders will be dynamically inserted here -->
                </div>
                <div id="images-container" class="main-content">
                    <h2>Select a folder to view images.</h2>
                </div>
            </div>
        </div>

        <script src="popup.js" defer></script>
    
    <div id="loading-spinner" class="spinner" style="display:none;"></div>


    <div id="toast" class="toast" aria-live="polite"></div>
</body>
</html>
